[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "error-journal"
version = "0.1.0"
description = "A Python library for error logging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "WhaleHook" }
]

dependencies = []

[project.scripts]
error-journal = "error_journal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["error_journal*"]